# Site independente: porta 8080 -> Streamlit em 127.0.0.1:8501. Não altera nenhum outro server block.
map $http_upgrade $painel_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream painel_streamlit {
    server 127.0.0.1:8501;
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Arquivos estáticos do Streamlit têm hash no nome: cache longo no navegador.
    location /static/ {
        proxy_pass http://painel_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket do Streamlit: sem buffer, conexão longa.
    location /_stcore/stream {
        proxy_pass http://painel_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $painel_connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        proxy_pass http://painel_streamlit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $painel_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
